name: Secret scanning

# Scans the repository and pull requests for committed secrets (API keys,
# tokens, credentials) using TruffleHog. This complements GitHub's native
# secret scanning by running on every push and pull request and verifying
# detected secrets where possible.
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "30 7 * * 1" # 07:30 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the scan covers the whole diff range, not just the
          # tip commit.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          extra_args: --results=verified,unknown
