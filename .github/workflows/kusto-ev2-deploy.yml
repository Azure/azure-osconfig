name: Kusto Geneva GDS EV2 Deploy

# Submits a Geneva GDS EV2 rollout to register OSConfig Linux telemetry
# customer-configs against the AME-tenant Kusto clusters.
#
# Why this lives here (azure-osconfig) and not in the SKATE ADO repo:
# - AME-tenant Kusto AKV trusts only AME-class tenants. Submitting EV2 from
#   the corp tenant fails with AKV10032. ADO pipelines in dev.azure.com/microsoft
#   would have solved this but the OSGData Project Admin perm grant is gated
#   behind a JIT group not available in our jitaccess catalog.
# - osconfig-prod-release-pool runner already runs in an AME-trusted environment
#   and has a managed identity that can call AKV / ARM at the right scope.
# - Falling back to GitHub Actions on the existing self-hosted pool gives us
#   the AME context we need without a new ADO Project Admin ask.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which cluster to target'
        required: true
        type: choice
        options:
          - NonProd
          - Prod
        default: NonProd
      ev2Infra:
        description: 'EV2 infrastructure (test = faster iteration, prod = production-grade SLA)'
        required: true
        type: choice
        options:
          - test
          - prod
        default: test

jobs:
  deploy:
    name: 'EV2 deploy (${{ inputs.target }} / ${{ inputs.ev2Infra }})'
    runs-on: [self-hosted, 1ES.Pool=osconfig-prod-release-pool, 1ES.ImageOverride=build-infra]
    concurrency:
      group: kusto-ev2-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      EV2_ROOT: ${{ github.workspace }}/.github/ev2
    steps:
      - uses: actions/checkout@v4

      - name: Prepare EV2 CLI
        run: |
          set -euo pipefail
          chmod +x "$EV2_ROOT/tools/ev2"
          mkdir -p "$HOME/.ev2"
          cp -r "$EV2_ROOT/tools/configurations" "$HOME/.ev2/"
          "$EV2_ROOT/tools/ev2" --version

      - uses: azure/login@v2
        with:
          auth-type: IDENTITY
          tenant-id: ${{ secrets.AZURE_AME_TENANT_ID }}
          subscription-id: a6b7bb76-38f5-4440-95c2-5c2d031a5d62

      - name: Show EV2 package
        run: |
          set -euo pipefail
          PKG="$EV2_ROOT/${{ inputs.target }}"
          echo "Listing $PKG"
          ls -la "$PKG"
          echo "--- RolloutSpec.json ---"
          cat "$PKG/RolloutSpec.json"
          echo "--- ScopeBindings.json ---"
          cat "$PKG/ScopeBindings.json"
          echo "--- ServiceModel.json ---"
          cat "$PKG/ServiceModel.json"

      - name: Submit EV2 rollout
        run: |
          set -euo pipefail
          PKG="$EV2_ROOT/${{ inputs.target }}"
          cd "$PKG"
          "$EV2_ROOT/tools/ev2" rollout new \
            --rolloutspec RolloutSpec.json \
            --servicegrouproot "$PKG" \
            --rolloutinfra ${{ inputs.ev2Infra }} \
            --use-az-cli
