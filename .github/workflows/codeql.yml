name: CodeQL

on:
  push:
    branches: [dev, main, release/*]
  schedule:
    - cron: 30 1 1,15 * * # At 01:30 UTC on the 1st and 15th of every month

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/microsoft/kompli/ubuntu-22.04-amd64@sha256:98cd5889fffd4d86eeeeb6bd730525365e05c228a64bef2070f777abbcc59373
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL language support https://aka.ms/codeql-docs/language-support
        language: [cpp, csharp]

    steps:
      - uses: actions/checkout@v5
        if: matrix.language == 'cpp'
        with:
          submodules: recursive
          clean: true

      - uses: actions/checkout@v5
        if: matrix.language == 'csharp'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - run: mkdir build
        if: matrix.language == 'cpp'

      - name: Generate build
        if: matrix.language == 'cpp'
        working-directory: build
        run: cmake ../src -DCMAKE_build-type=Release -Duse_prov_client=ON -Dhsm_type_symm_key=ON -DCOMPILE_WITH_STRICTNESS=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=ON -DBUILD_ADAPTERS=ON

      - name: Build azure-osconfig
        if: matrix.language == 'cpp'
        working-directory: build
        run: cmake --build . --config Release # --parallel

      - name: Setup dotnet
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x

      - name: Autobuild
        if: matrix.language == 'csharp'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'

  # Needed for required checks to aggregate the results of all codeql executions
  codeql-status:
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - run: ${{!contains(needs.*.result, 'failure')}}
