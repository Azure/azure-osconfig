name: CodeQL

on:
  pull_request:
    paths:
      - .github/workflows/codeql.yml
  push:
    branches: [dev, main, release/*]
  schedule:
    - cron: 30 1 1,15 * * # At 01:30 UTC on the 1st and 15th of every month

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/microsoft/kompli/ubuntu-22.04-amd64@sha256:98cd5889fffd4d86eeeeb6bd730525365e05c228a64bef2070f777abbcc59373
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL language support https://aka.ms/codeql-docs/language-support
        language: [cpp]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          clean: true

      - name: Mark workspace as safe for git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: ${{ matrix.language }}

      - name: Generate build
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_TELEMETRY=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: '/language:${{matrix.language}}'

  # Needed for required checks to aggregate the results of all codeql executions
  codeql-status:
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - run: ${{!contains(needs.*.result, 'failure')}}
