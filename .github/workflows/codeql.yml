name: CodeQL

on:
  push:
    branches: [dev, main, release/*]
  schedule:
    - cron: 30 1 1,15 * * # At 01:30 UTC on the 1st and 15th of every month

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/azure/azure-osconfig/ubuntu-22.04-amd64@sha256:0eed71cef37604c37186ec035974168a40a84d27e26d3b746a2858d99f305e2e
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL language support https://aka.ms/codeql-docs/language-support
        language: [cpp, csharp]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.language == 'cpp'
        with:
          submodules: recursive
          clean: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.language == 'csharp'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - run: mkdir build
        if: matrix.language == 'cpp'

      - name: Generate build
        if: matrix.language == 'cpp'
        working-directory: build
        run: cmake ../src -DCMAKE_build-type=Release -Duse_prov_client=ON -Dhsm_type_symm_key=ON -DCOMPILE_WITH_STRICTNESS=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=ON -DBUILD_ADAPTERS=ON

      - name: Build azure-osconfig
        if: matrix.language == 'cpp'
        working-directory: build
        run: cmake --build . --config Release --parallel

      - name: Setup dotnet
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
        with:
          dotnet-version: 6.0.x

      - name: Autobuild
        if: matrix.language == 'csharp'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{matrix.language}}'

  # Needed for required checks to aggregate the results of all codeql executions
  codeql-status:
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - run: ${{!contains(needs.*.result, 'failure')}}
