name: E2E Report

on:
  workflow_run:
    workflows: ['E2E']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc
        with:
          artifact: e2e-report
          name: E2E Report
          path: '*.trx'
          reporter: dotnet-trx
