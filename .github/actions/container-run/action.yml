name: Container run
description: Run a docker container

inputs:
  registry:
    description: Container registry.
    required: false
    default: ""
  container:
    description: The name of the container.
    required: true
  mount:
    description: The volume to mount.
    required: true
  tag:
    description: The container tag.
    required: false
    default: latest
  args:
    description: Additional arguments to pass to the container.
    required: false
    default: ""
  verify:
    description: Verify the image's cosign signature before running it.
    required: false
    default: "false"
  cosign-certificate-identity-regexp:
    description: Regexp the signing workflow identity must match (keyless cosign).
    required: false
    default: '^https://github\.com/microsoft/kompli/\.github/workflows/build-containers\.yml@refs/heads/(main|dev)$'
  cosign-oidc-issuer:
    description: Expected OIDC issuer of the signing identity.
    required: false
    default: "https://token.actions.githubusercontent.com"

outputs:
  id:
    description: The container id of the running container.
    value: ${{ steps.container.outputs.id }}

runs:
  using: composite
  steps:
    - name: Setup container
      id: setup
      run: |
        if [ -n "${{ inputs.registry }}" ]; then
          image=${{ inputs.registry }}/${{ inputs.container }}
        else
          image=${{ inputs.container }}
        fi

        echo container=$image >> $GITHUB_OUTPUT
      shell: bash

    - name: Install cosign
      if: ${{ inputs.verify == 'true' }}
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Verify image signature
      id: verify
      if: ${{ inputs.verify == 'true' }}
      shell: bash
      run: |
        name="${{ steps.setup.outputs.container }}"
        tag="${{ inputs.tag }}"
        if [[ "${tag}" =~ ^@sha256:.* ]] ; then
          # Already pinned by digest; verify exactly that content.
          ref="${name}${tag}"
        else
          # Resolve the mutable tag to an immutable digest so we verify what we run.
          digest=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          ref="${name}@${digest}"
        fi
        echo "Verifying cosign signature for ${ref}"
        cosign verify "${ref}" \
          --certificate-identity-regexp "${{ inputs.cosign-certificate-identity-regexp }}" \
          --certificate-oidc-issuer "${{ inputs.cosign-oidc-issuer }}"
        # Export the verified, immutable reference so the run step uses exactly
        # what was verified (avoids a TOCTOU where a mutable tag could move
        # between verification and execution).
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Run container
      id: container
      shell: bash
      run: |
        name="${{ steps.setup.outputs.container }}"
        tag="${{ inputs.tag }}"
        verified_ref="${{ steps.verify.outputs.ref }}"
        if [[ -n "${verified_ref}" ]] ; then
          # Verification ran: use the exact digest that cosign verified.
          container_name_tag="${verified_ref}"
        elif [[ "${tag}" =~ ^@sha256:.* ]] ; then
          container_name_tag="${name}${tag}"
        else
          container_name_tag="${name}:${tag}"
        fi
        echo "Running container ${container_name_tag}"
        id=$(docker run -di --privileged ${{ inputs.args }} -v ${{ inputs.mount }} "${container_name_tag}")

        echo Container ID: $id
        echo id=$id >> $GITHUB_OUTPUT
